<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — BRL Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#A01220; --paper:#FBF9F9; --card:#FFFFFF;
  --line:#EBDFE0; --ink:#2A1518; --red:#C43D2E;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:34px 32px;width:100%;max-width:360px;box-shadow:0 4px 24px rgba(160,18,32,.08);
}
h1{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;
  color:var(--navy);letter-spacing:.3px;margin-bottom:4px;
}
p.sub{color:#8A6B6E;font-size:12.5px;margin-bottom:24px}
label{display:block;font-size:12px;font-weight:600;color:#6B5A5D;margin-bottom:6px;margin-top:16px}
input{
  width:100%;font-family:'Inter';font-size:14px;padding:10px 12px;
  border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);
}
input:focus{outline:none;border-color:var(--navy)}
button{
  width:100%;margin-top:22px;background:var(--navy);color:#fff;border:0;
  padding:11px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;
}
button:hover{background:#8A0F1B}
.err{
  background:#F9DFDD;color:var(--red);border-radius:7px;padding:9px 12px;
  font-size:12.5px;margin-top:16px;display:none;
}
.err.show{display:block}
</style>
</head>
<body>
<div class="card">
  <h1>BRL Command Center</h1>
  <p class="sub">Cold outreach cockpit — sign in to continue</p>
  <form id="f" method="POST" action="/login">
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required autofocus>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <div class="err" id="err">Incorrect username or password.</div>
    <button type="submit">Sign in</button>
  </form>
</div>
<script>
// If redirected here after a failed login (?error=1), show the message.
if (new URLSearchParams(location.search).get('error')) {
  document.getElementById('err').classList.add('show');
}
</script>
</body>
</html>
