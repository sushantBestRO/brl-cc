<style>
:root{
 --navy:#A01220; --navy2:#BF1B2C; --paper:#FBF9F9; --card:#FFFFFF;
 --amber:#FFFFFF; --amber-d:#7E0D18; --green:#1E7A4C; --red:#C43D2E;
 --slate:#6B5A5D; --line:#EBDFE0; --ink:#2A1518;
 --hot:#FFE3C9; --won:#DDF0E5; --dead:#EDEDED; --bad:#F9DFDD; --fresh:#E3F0E8; --fup:#FFF0D2; --cold:#E9E4F2; --nurt:#F2E4EA;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);font-size:13.5px}
button{font-family:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
/* ---- rail ---- */
.rail{background:var(--navy);color:#fff;padding:18px 0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:0 18px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand h1{font-family:'Barlow Condensed';font-weight:700;font-size:26px;letter-spacing:.5px;line-height:1}
.brand h1 span{color:#FFD9DD}
.brand p{font-size:10.5px;color:#F0C4C9;margin-top:4px;letter-spacing:.4px;text-transform:uppercase}
.nav{margin-top:14px;flex:1}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#F3D2D6;padding:11px 18px;font-size:13.5px;font-weight:500;border-left:3px solid transparent;text-align:left}
.nav button.on{color:#fff;background:rgba(255,255,255,.12);border-left-color:#fff}
.nav button:hover{color:#fff}
.nav .cnt{margin-left:auto;background:#fff;color:var(--navy);font-weight:700;font-size:10.5px;border-radius:9px;padding:1px 7px}
.railfoot{padding:12px 18px;font-size:10.5px;color:#E8B9BE;border-top:1px solid rgba(255,255,255,.12)}
/* ---- main ---- */
.main{padding:0 0 60px}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
.topbar .day{font-family:'Barlow Condensed';font-weight:700;font-size:22px;letter-spacing:.4px}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:3px}
.badge.sat{background:var(--navy);color:#fff}
.badge.lunch{background:var(--cold);color:var(--navy)}
.topstats{margin-left:auto;display:flex;gap:20px}
.topstats div{text-align:right}
.topstats b{font-family:'Barlow Condensed';font-size:21px;font-weight:700;display:block;line-height:1}
.topstats span{font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--slate)}
.wrap{padding:22px 26px;max-width:1240px}
h2.sec{font-family:'Barlow Condensed';font-weight:700;font-size:19px;letter-spacing:.6px;text-transform:uppercase;color:var(--navy);margin:22px 0 10px}
h2.sec small{font-family:'Inter';font-size:11px;font-weight:500;color:var(--slate);text-transform:none;letter-spacing:0;margin-left:8px}
/* ---- highway meter (signature) ---- */
.road{background:var(--navy);border-radius:10px;padding:18px 22px 20px;color:#fff;position:relative;overflow:hidden}
.road h3{font-family:'Barlow Condensed';font-size:15px;font-weight:600;letter-spacing:1.5px;color:#F3C6CB;text-transform:uppercase}
.road .big{font-family:'Barlow Condensed';font-weight:700;font-size:44px;line-height:1;margin:2px 0 10px}
.road .big em{font-style:normal;color:#FFD9DD}
.lane{height:26px;background:#2B2B30;border-radius:5px;position:relative;border:1px solid #46464E}
.lane .fill{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,#F4F4F4,#FFFFFF);border-radius:4px;transition:width .6s;box-shadow:0 0 8px rgba(255,255,255,.5)}
.lane .dash{position:absolute;top:50%;left:0;right:0;height:0;border-top:3px dashed rgba(255,255,255,.55);transform:translateY(-50%);pointer-events:none}
.lane .truck{position:absolute;top:-13px;font-size:19px;transition:left .6s;transform:translateX(-50%)}
.roadrow{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap}
.mini{flex:1;min-width:110px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:9px 12px}
.mini b{font-family:'Barlow Condensed';font-size:24px;font-weight:700;display:block;line-height:1}
.mini span{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:#F0C4C9}
.mini .gap{font-size:10.5px;font-weight:700}
.gap.ok{color:#6FCF97}.gap.no{color:#FF8A73}
/* ---- queues ---- */
.queues{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:16px}
.q{background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.q h4{font-family:'Barlow Condensed';font-size:14.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:9px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.q.due h4{background:var(--fup)}.q.retry h4{background:var(--cold)}.q.fresh h4{background:var(--fresh)}.q.over h4{background:var(--bad);color:var(--red)}
.q ul{list-style:none;max-height:250px;overflow:auto}
.q li{padding:8px 13px;border-bottom:1px solid var(--line);font-size:12.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.q li:last-child{border-bottom:0}
.q li .co{font-weight:600;cursor:pointer}
.q li .co:hover{color:var(--navy2)}
.q li small{color:var(--slate);display:block;font-size:11px}
.q .empty{padding:14px;color:var(--slate);font-size:12px}
/* ---- table ---- */
.toolrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,textarea{font-family:'Inter';font-size:12.5px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy2);outline-offset:0}
.btn{border:0;border-radius:6px;padding:8px 13px;font-weight:600;font-size:12.5px}
.btn.amber{background:var(--navy);color:#fff}
.btn.amber:hover{background:#F6E7E9}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btn.sm{padding:5px 9px;font-size:11.5px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden}
th{font-family:'Barlow Condensed';font-size:12.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;background:var(--navy);color:#fff;padding:8px 10px;text-align:left}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.lead{cursor:pointer}
tr.lead:hover td{background:#FBEFF0}
.st{font-size:10px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:3px;white-space:nowrap}
.st.HOT{background:var(--hot);color:#8A4B00}.st.OPEN{background:#EEF1F5;color:var(--slate)}
.st.FRESH{background:var(--fresh);color:var(--green)}.st.DEAD{background:var(--dead);color:#777}
.st.BADDATA{background:var(--bad);color:var(--red)}.st.PARKED{background:var(--dead);color:#777}
.st.FOLLOWUP{background:var(--fup);color:#8A6A00}.st.WON{background:var(--won);color:var(--green)}
.st.COLD{background:var(--cold);color:var(--navy)}.st.NURTURE{background:var(--nurt);color:#6B4E8E}
/* ---- drawer ---- */
.drawer{position:fixed;top:0;right:-560px;width:540px;max-width:96vw;height:100vh;background:#fff;box-shadow:-8px 0 30px rgba(16,35,63,.25);transition:right .25s;z-index:20;display:flex;flex-direction:column}
.drawer.open{right:0}
.dhead{background:var(--navy);color:#fff;padding:16px 20px}
.dhead h3{font-family:'Barlow Condensed';font-size:24px;font-weight:700;letter-spacing:.4px}
.dhead p{font-size:12px;color:#F3CBD0;margin-top:2px}
.dhead .x{position:absolute;top:12px;right:16px;background:none;border:0;color:#fff;font-size:20px}
.dbody{padding:16px 20px;overflow:auto;flex:1}
.frow{margin-bottom:12px}
.frow label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--slate);margin-bottom:4px}
.frow select,.frow input,.frow textarea{width:100%}
.actbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:6px 0 14px}
.act{border-radius:8px;border:1.5px solid var(--line);background:#fff;padding:10px 6px;text-align:center;font-weight:700;font-size:13px}
.act span{display:block;font-size:9.5px;font-weight:600;color:var(--slate);letter-spacing:.4px;text-transform:uppercase;margin-top:2px}
.act.call{border-color:var(--green);color:var(--green)}
.act.mail{border-color:var(--navy);color:var(--navy)}
.act.wa{border-color:#1FA855;color:#1FA855}
.act:hover{background:#FBEFF0}
.hist{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:10px 12px;font-size:12px;color:#3C4A5C;max-height:120px;overflow:auto}
.savedtick{font-size:11px;color:var(--green);font-weight:600}
/* ---- pipeline ---- */
.funnel{max-width:760px;margin:6px auto 0}
.fstage{margin:0 auto 10px;color:#fff;border-radius:8px;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;min-width:220px;transition:transform .15s}
.fstage:hover{transform:scale(1.015)}
.fstage b{font-family:'Barlow Condensed';font-size:26px;font-weight:700}
.fstage span{font-size:11px;letter-spacing:.8px;text-transform:uppercase;font-weight:700}
.fstage small{font-size:10.5px;opacity:.85;display:block;font-weight:500;text-transform:none;letter-spacing:0}
.fconv{text-align:center;font-size:11px;color:var(--slate);margin:-4px 0 8px;font-weight:600}
.leak{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.leak .card{text-align:center;cursor:pointer}
.leak b{font-family:'Barlow Condensed';font-size:26px;display:block}
/* ---- import ---- */
.drop{border:2px dashed var(--slate);border-radius:10px;padding:34px;text-align:center;background:#fff;color:var(--slate)}
.drop.hover{border-color:var(--navy);background:#FBEFF0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:16px}
.card h3{font-family:'Barlow Condensed';font-size:16px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}
.note{font-size:11.5px;color:var(--slate);line-height:1.5}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:50;display:none}
.pill{display:inline-block;background:#EEF1F5;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--slate);margin:2px 4px 2px 0;border:1px solid var(--line);cursor:pointer}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
@media(max-width:880px){
 .app{grid-template-columns:1fr}
 .rail{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;padding:0;z-index:30}
 .brand,.railfoot{display:none}
 .nav{display:flex;margin:0;width:100%}
 .nav button{flex-direction:column;gap:2px;padding:9px 4px;font-size:10px;border-left:0;border-top:3px solid transparent;justify-content:center;align-items:center}
 .nav button.on{border-top-color:var(--amber)}
 .nav .cnt{display:none}
 .main{padding-bottom:80px}
 th{top:0}
 .grid2{grid-template-columns:1fr}
}
</style></head>

/* ================= STORAGE POLYFILL (server-backed KV) =================
   Replaces the Claude-artifact-only `window.storage` with calls to our
   own tiny Express API (see server.js). Same get/set contract, so the
   DATA LAYER code below needs zero changes. */
window.storage = {
  async get(key){
    const r = await fetch('/api/kv/' + encodeURIComponent(key));
    if(!r.ok) throw new Error('kv-get-failed:' + r.status);
    return await r.json(); // {value: "..."}
  },
  async set(key, value){
    const r = await fetch('/api/kv/' + encodeURIComponent(key), {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({value})
    });
    if(!r.ok) throw new Error('kv-set-failed:' + r.status);

};

function getDemoLeads(){if(!DEMO_LEADS)DEMO_LEADS=SEED.map(x=>({...x}));return DEMO_LEADS;}
async function loadDB(){
 if(!window.storage){storageOK=false;LIVE_LEADS=SEED.map(x=>({...x,src:'seed'}));LIVE_ACTIVITY=[];applyDataMode();return;}
 try{const r=await window.storage.get('brl-leads');LIVE_LEADS=JSON.parse(r.value);}
 catch(e){LIVE_LEADS=SEED.map(x=>({...x,src:'seed'}));try{await window.storage.set('brl-leads',JSON.stringify(LIVE_LEADS));}catch(e2){}}
 try{const r=await window.storage.get('brl-activity');LIVE_ACTIVITY=JSON.parse(r.value);}catch(e){LIVE_ACTIVITY=[];}
 try{const r=await window.storage.get('brl-settings');DB.settings={...DB.settings,...JSON.parse(r.value)};}catch(e){}
 applyDataMode();
}
// LIVE mode only shows leads you actually added (Import / Add) — the original
// 150-sample leads (src:'seed', or no src at all on older data) stay hidden
// in Live, but remain untouched on disk (and in the daily backup) — only
// DEMO mode ever shows the hardcoded sample.
function applyDataMode(){
 if(DB.settings.demoMode){DB.leads=getDemoLeads();DB.activity=DEMO_ACTIVITY=DEMO_ACTIVITY||[];}
 else{DB.leads=LIVE_LEADS.filter(l=>l.src==='import'||l.src==='manual');DB.activity=LIVE_ACTIVITY;}
}
function setDataMode(mode){
 const demo=mode==='demo';
 if(demo===!!DB.settings.demoMode)return;
 DB.settings.demoMode=demo;
 applyDataMode();
 saveDB('settings');
 render();
 toast(demo?'🧪 Showing DEMO data — nothing here is saved':'✅ Showing LIVE data — only leads you added');
}
function recoverLead(){
 const q=($('#recoverQ').value||'').trim().toLowerCase();
 const box=$('#recoverResult');
 if(!q){box.style.color='var(--red)';box.textContent='Type a company name or mobile number first.';return;}
 const hidden=LIVE_LEADS.filter(l=>l.src!=='import'&&l.src!=='manual');
 const matches=hidden.filter(l=>(l.co||'').toLowerCase().includes(q)||(l.mob||'').replace(/\D/g,'').includes(q.replace(/\D/g,'')));
 if(!matches.length){box.style.color='var(--red)';box.textContent='No hidden lead matched that search.';return;}
 if(matches.length>1){box.style.color='var(--red)';box.textContent=matches.length+' matches found ('+matches.map(m=>m.co).join(', ')+') — search something more specific, like the full mobile number.';return;}
 matches[0].src='manual';
 applyDataMode();saveDB('leads');render();
 box.style.color='var(--green)';box.textContent='✅ "'+matches[0].co+' — '+matches[0].name+'" is now visible in Live.';
}

async function saveDB(what){
 if(!storageOK)return;
 try{
  if(DB.settings.demoMode){
   // Demo mode: never write fake leads/activity over the real server data.
   if(!what||what==='settings')await window.storage.set('brl-settings',JSON.stringify(DB.settings));
   return;
  }
  // Always persist the FULL live array (LIVE_LEADS), not the filtered DB.leads
  // view — so seed-origin leads stay safe on disk even while hidden from view.
  // Saves fire immediately (no debounce) so a quick navigation away — e.g.
  // tapping WhatsApp right after adding a lead — can never race past a pending write.
  if(!what||what==='leads')await window.storage.set('brl-leads',JSON.stringify(LIVE_LEADS));
  if(!what||what==='activity'){LIVE_ACTIVITY=DB.activity;await window.storage.set('brl-activity',JSON.stringify(DB.activity.slice(-2500)));}
  if(!what||what==='settings')await window.storage.set('brl-settings',JSON.stringify(DB.settings));
 }catch(e){toast('⚠ Save failed — retrying on next change');}
}

}
/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600);}
function p10(m){const d=String(m||'').replace(/\D/g,'');return d.length>=10?d.slice(-10):'';}
function todayKey(d){d=d||new Date();return d.toISOString().slice(0,10);}
function fmtD(iso){if(!iso)return'—';const d=new Date(iso);return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});}
function nextWorkDay(days){const d=new Date();while(days>0){d.setDate(d.getDate()+1);if(d.getDay()!==0)days--;}return todayKey(d);}
function isSat(){return new Date().getDay()===6;}
function stCls(s){return (s||'OPEN').replace(/[^A-Z]/g,'');}
function esc(x){return String(x||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function tplStore(){

function fillTpl(str,L){
 const sig="\n\nWarm regards,\nJagruti Bhandari\nBest Roadways Limited\n800+ owned vehicles · 65+ branches · Nhava Sheva bonded warehouse";
 return String(str||'')
  .replace(/\{name\}/g,L.name||"Sir/Ma'am")
  .replace(/\{co\}/g,L.co||'')
  .replace(/\{mob\}/g,L.mob||'')
  .replace(/\{desig\}/g,L.desig||'')
  .replace(/\{loc\}/g,L.loc||'')
  .replace(/\{remarks\}/g,L.remarks||'—')
  .replace(/\{hist\}/g,(L.hist||'').slice(0,300))
  .replace(/\{profileUrl\}/g,DB.settings.profileUrl||'')
  .replace(/\{sig\}/g,sig);
}

function todayStats(){
 const tk=todayKey();const s={dials:0,conn:0,em:0,wa:0,mtg:0,rfq:0};
 DB.activity.forEach(a=>{if(new Date(a.t).toISOString().slice(0,10)!==tk)return;
  if(a.ch==='CALL')s.dials++;
  if(a.ch==='EMAIL')s.em++;
  if(a.ch==='WHATSAPP')s.wa++;
  if(a.ch==='OUTCOME'){const m=OUTCOMES[a.ty];if(m&&m.conn)s.conn++;
   if(a.ty.indexOf('Meeting')>-1)s.mtg++;if(a.ty.indexOf('RFQ received')>-1)s.rfq++;}});
 return s;
}
function queues(){
 const tk=todayKey();const sat=isSat();
 const due=[],retry=[],over=[],fresh=[];
 DB.leads.forEach(L=>{
  if(/DEAD|BAD/.test(L.status))return;
  if(L.stage===8&&L.stageStatus==='Completed')return; // Agreement Signed — out of the working queues
  if(sat&&!L.sat)return;
  if(L.nextDate){
   if(L.nextDate===tk)(/Ringing|Busy|Switched/.test(L.outcome)?retry:due).push(L);
   else if(L.nextDate<tk&&L.status!=='PARKED')over.push(L);
  } else if((L.stage??0)===0)fresh.push(L);
 });
 return {due,retry,over,fresh};
}

function redFlags(){
 const X=DB.settings.redFlagDays||3,Y=DB.settings.wonFlagDays||30;
 const daysSince=iso=>{if(!iso)return 999;const d=new Date(iso);return Math.floor((new Date()-d)/86400000);};
 const flags=[];
 DB.leads.forEach(L=>{
  if(L.status==='PARKED'||L.status==='BAD DATA'||L.status==='DEAD')return;
  const stage=L.stage??0,ss=L.stageStatus||'Initiated';
  if(stage>=1&&ss==='Completed'&&stage<8){
   const days=daysSince(L.stageDate);
   if(days>=X)flags.push({L,type:'STALLED',days,msg:'Stage '+stage+' ('+FUNNEL_STAGES[stage-1]+') done, Stage '+(stage+1)+' ('+FUNNEL_STAGES[stage]+') not started — '+days+'d. Re-initiate Stage '+(stage+1)+'.'});
  }
  if(stage===8&&ss==='Completed'&&!L.firstLoadMoved){
   const days=daysSince(L.stageDate);
   if(days>=Y)flags.push({L,type:'NO_LOAD',days,msg:'Agreement signed '+days+'d ago, no load moved yet. Follow up on first load.'});
  }
 });
 return flags;
}

// Parses a "Pipeline Stage" style column from a transaction-history export,
// e.g. "Stage 6 — Negotiation Initiated", "Stage 8 — WON / Active",
// "OUT — DEAD (...)", "PRE-FUNNEL — Not yet connected".
function parsePipelineStageText(raw){
 const t=String(raw||'').trim();
 if(/^OUT\s*—?\s*BAD DATA/i.test(t))return{status:'BAD DATA',stage:1,stageStatus:'Initiated'};
 if(/^OUT\s*—?\s*DEAD/i.test(t))return{status:'DEAD',stage:1,stageStatus:'Initiated'};
 if(/^PRE-?FUNNEL/i.test(t))return{status:'ACTIVE',stage:0,stageStatus:'Initiated'};
 const m=t.match(/Stage\s*(\d)/i);
 if(m){
  const n=Math.max(0,Math.min(8,+m[1]));
  return{status:'ACTIVE',stage:n,stageStatus:n===0?'Initiated':'Completed'}; // historical data describes a stage already reached
 }
 return{status:'ACTIVE',stage:1,stageStatus:'Initiated'};
}
// Parses a bare "29-Jul" style date (no year, as portal exports use) into
// an ISO date string, assuming the current year unless that lands in the future.
function parseHistDate(raw){
 const t=String(raw||'').trim();
 const m=t.match(/^(\d{1,2})[-\s]([A-Za-z]{3})/);
 if(!m)return'';
 const months={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
 const mo=months[m[2].toLowerCase()];
 if(mo===undefined)return'';
 let y=new Date().getFullYear();
 let d=new Date(y,mo,+m[1]);
 if(d>new Date())d=new Date(y-1,mo,+m[1]);
 return todayKey(d);
}
function importRows(rows,fname,asDead){
 const byPhone=new Map(),byEmail=new Map(),byCompany=new Map();
 LIVE_LEADS.forEach(l=>{const p=p10(l.mob);if(p)byPhone.set(p,l);if(l.em)byEmail.set(l.em.toLowerCase(),l);
  if(!p&&!l.em&&l.co)byCompany.set(l.co.trim().toLowerCase(),l); // only used as a last-resort key when there's truly nothing else to match on
 });
 let maxId=Math.max(0,...LIVE_LEADS.map(l=>l.id));let added=0,updated=0;
 rows.forEach(r=>{
  const co=pick(r,['company','account','organisation','organization']);
  const name=pick(r,['contact','name','person']);
  if(!co&&!name)return;
  const mobRaw=pick(r,['mobile','phone','number','cell']);
  const mob=mobRaw.split('/')[0].trim(); // multiple numbers separated by "/" — first is primary, rest kept in history
  let em=pick(r,['email','mail']);
  if(!em){ // sometimes a portal export has the email sitting in the wrong column entirely
   const EMAIL_RE=/[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i;
   for(const v of Object.values(r)){const m=EMAIL_RE.exec(String(v||''));if(m){em=m[0];break;}}
  }
  const p=p10(mob);
  let existingLead=(p&&byPhone.get(p))||(em&&byEmail.get(em.toLowerCase()));
  if(!existingLead&&!p&&!em&&co)existingLead=byCompany.get(co.trim().toLowerCase()); // no phone/email at all on either side — fall back to company name

  let loc=pick(r,['location','city','state']);
  if(/[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i.test(loc))loc=''; // that "location" was actually an email — don't keep it as a fake city

  const stageText=pick(r,['pipeline stage','stage']);
  const parsed=stageText?parsePipelineStageText(stageText):{status:'ACTIVE',stage:0,stageStatus:'Initiated'};
  const outcomeRaw=pick(r,['latest outcome','outcome']);
  const remarkLatest=pick(r,['latest remark']);
  const remarkHist=pick(r,['remark history']);
  const nextStep=pick(r,['next step']);
  const lastActivity=pick(r,['last activity']);
  const desig=pick(r,['desig','title','role','position']);
  const industry=pick(r,['industry','sector']);
  const camp=pick(r,['source of lead','source','campaign']);

  let hist=remarkHist?remarkHist.split('||').map(s=>s.trim()).filter(Boolean).join('\n'):'';
  if(mobRaw.includes('/'))hist=(hist?hist+'\n':'')+'All numbers on file: '+mobRaw;
  if(nextStep)hist=(hist?hist+'\n':'')+'Next step (from import): '+nextStep;

  if(existingLead){
   // Already have this lead (matched by phone or email) — refresh it with whatever
   // this file now says, rather than silently skipping. Only overwrite a field if
   // the new row actually has a value for it, so a sparser re-upload can't blank
   // out data that was already there.
   if(co)existingLead.co=co;
   if(name)existingLead.name=name;
   if(desig)existingLead.desig=desig;
   if(loc)existingLead.loc=loc;
   if(industry)existingLead.industry=industry;
   if(camp)existingLead.camp=camp;
   if(mob)existingLead.mob=mob;
   if(em)existingLead.em=em;
   const stageChanged=stageText&&(existingLead.stage!==parsed.stage||existingLead.stageStatus!==parsed.stageStatus);
   if(stageText){existingLead.status=parsed.status;existingLead.stage=parsed.stage;existingLead.stageStatus=parsed.stageStatus;}
   if(stageChanged)existingLead.stageDate=todayKey(); // only reset the red-flag clock if the stage genuinely moved
   if(outcomeRaw)existingLead.outcome=mapOutcomeText(outcomeRaw);
   if(remarkLatest)existingLead.remarks=remarkLatest;
   if(hist)existingLead.hist=hist;
   if(lastActivity){const d=parseHistDate(lastActivity);if(d)existingLead.lastCall=d;}
   updated++;
  }else{
   const newLead={id:++maxId,camp:asDead?'Dead client revival':(camp||('Import '+new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short'}))),
    co,name,desig,loc,industry,mob,em,sat:true,hist,
    status:asDead?'DEAD':parsed.status,stage:asDead?0:parsed.stage,stageStatus:asDead?'Initiated':parsed.stageStatus,stageDate:todayKey(),
    revivalStage:asDead?0:undefined,revivalDate:asDead?todayKey():undefined,revivalPriority:asDead?'high':undefined,
    outcome:mapOutcomeText(outcomeRaw),remarks:remarkLatest,nextDate:'',lastCall:parseHistDate(lastActivity),src:'import'};
   LIVE_LEADS.push(newLead);
   if(p)byPhone.set(p,newLead);if(em)byEmail.set(em.toLowerCase(),newLead); // so a duplicate later in this same file matches this one too
   if(!p&&!em&&co)byCompany.set(co.trim().toLowerCase(),newLead);
   added++;
  }
 });
 applyDataMode();saveDB('leads');
 $('#impPrev').innerHTML='<div class="note" style="margin-top:10px">✅ <b>'+added+'</b> new leads added, <b>'+updated+'</b> existing leads updated (matched by phone/email) from '+esc(fname)+'.</div>';
 logAct(null,'IMPORT',fname,added+' added, '+updated+' updated');toast(added+' added, '+updated+' updated ✓');render();
}

function tplField(scope,kind,label,hasSubject){
 const t=tplStore()[scope][kind];
 let h='<div class="frow" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)"><label style="font-size:12px;color:var(--slate)">'+label+'</label>';
 if(hasSubject){
  h+='<input value="'+esc(t.s)+'" placeholder="Subject" style="margin-bottom:6px" onchange="DB.settings.tpl.'+scope+'.'+kind+'.s=this.value;saveDB(\'settings\')">';
  h+='<textarea rows="5" onchange="DB.settings.tpl.'+scope+'.'+kind+'.b=this.value;saveDB(\'settings\')">'+esc(t.b)+'</textarea>';
 }else{
  h+='<textarea rows="4" onchange="DB.settings.tpl.'+scope+'.'+kind+'=this.value;saveDB(\'settings\')">'+esc(t)+'</textarea>';
 }
 h+='</div>';
 return h;
}
function vUserMgmt(){
 let h='<div class="card" style="margin-top:16px"><h3>👤 User management</h3>'+
  '<div class="note">Only visible to the admin account. Add teammates who need their own login, or change a password.</div>';
 if(USERS_LIST===null){
  h+='<div class="note" style="margin-top:8px">Loading users…</div></div>';
  return h;
 }
 h+='<table style="margin-top:10px"><thead><tr><th>Username</th><th>Type</th><th>Action</th></tr></thead><tbody>'+
  USERS_LIST.map(u=>{
   if(u.builtIn)return '<tr><td><b>'+esc(u.username)+'</b></td><td><span class="note">Built-in (set via .env)</span></td><td>—</td></tr>';
   return '<tr><td><b>'+esc(u.username)+'</b></td><td><span class="note">Added</span></td><td>'+
    '<div style="display:flex;gap:6px;align-items:center">'+
    '<input id="pw_'+esc(u.username)+'" type="password" placeholder="New password" style="width:130px">'+
    '<button class="btn sm ghost" onclick="changeUserPassword(\''+esc(u.username)+'\')">Set</button>'+
    '<button class="btn sm ghost" style="color:var(--red);border-color:var(--red)" onclick="deleteUserAccount(\''+esc(u.username)+'\')">🗑</button>'+
    '</div></td></tr>';
  }).join('')+
  '</tbody></table>'+
  '<div class="frow" style="margin-top:12px"><label>➕ Add a new user</label>'+
  '<div style="display:flex;gap:6px"><input id="newUserName" placeholder="Username" style="flex:1"><input id="newUserPass" type="password" placeholder="Password (6+ chars)" style="flex:1">'+
  '<button class="btn sm ghost" onclick="addUser()">Add</button></div></div>'+
  '<div id="userMgmtResult" class="note" style="margin-top:6px"></div>'+
  '</div>';
 return h;
}
async function addUser(){
 const box=$('#userMgmtResult');
 const username=($('#newUserName').value||'').trim();
 const password=$('#newUserPass').value||'';
 if(!username||!password){box.style.color='var(--red)';box.textContent='Enter both a username and password.';return;}
 try{
  const r=await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
  const j=await r.json();
  if(r.ok){box.style.color='var(--green)';box.textContent='✅ User "'+username+'" added.';$('#newUserName').value='';$('#newUserPass').value='';loadUsersList();}
  else{box.style.color='var(--red)';box.textContent='❌ '+(j.error||'Failed to add user.');}
 }catch(e){box.style.color='var(--red)';box.textContent='❌ Request failed — network error.';}
}
async function changeUserPassword(username){
 const box=$('#userMgmtResult');
 const input=$('#pw_'+username);
 const password=input?input.value:'';
 if(!password){box.style.color='var(--red)';box.textContent='Type a new password for '+username+' first.';return;}
 try{
  const r=await fetch('/api/users/'+encodeURIComponent(username)+'/password',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});
  const j=await r.json();
  if(r.ok){box.style.color='var(--green)';box.textContent='✅ Password updated for '+username+'.';if(input)input.value='';}
  else{box.style.color='var(--red)';box.textContent='❌ '+(j.error||'Failed to update password.');}
 }catch(e){box.style.color='var(--red)';box.textContent='❌ Request failed — network error.';}
}
async function deleteUserAccount(username){
 if(!confirm('Remove user "'+username+'"? They will no longer be able to log in.'))return;
 const box=$('#userMgmtResult');
 try{
  const r=await fetch('/api/users/'+encodeURIComponent(username),{method:'DELETE'});
  const j=await r.json();
  if(r.ok){box.style.color='var(--green)';box.textContent='✅ User "'+username+'" removed.';loadUsersList();}
  else{box.style.color='var(--red)';box.textContent='❌ '+(j.error||'Failed to remove user.');}
 }catch(e){box.style.color='var(--red)';box.textContent='❌ Request failed — network error.';}
}

function eodText(){
 const s=todayStats(),T=DB.settings,q=queues();
 const row=(l,a,t)=>l+': '+a+' / '+t+' ('+(a-t>=0?'+':'')+(a-t)+')';
 const hot=DB.activity.filter(a=>new Date(a.t).toISOString().slice(0,10)===todayKey()&&a.ch==='OUTCOME'&&/RFQ received|Meeting|WON/.test(a.ty)).map(a=>'• '+a.ty.split(' ')[0]+' '+a.co);
 return 'EOD REPORT — '+new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+' (Jagruti Bhandari)\n\n'+
 row('Connected calls',s.conn,T.tC)+'\n'+row('Emails',s.em,T.tE)+'\n'+row('WhatsApps',s.wa,T.tW)+'\n'+
 row('Meetings',s.mtg,T.tM)+'\n'+row('RFQs',s.rfq,T.tR)+'\n\nTotal dial attempts: '+s.dials+
 '\nOverdue follow-ups pending: '+q.over.length+
 (hot.length?'\n\nHot items today:\n'+hot.join('\n'):'')+'\n\n— auto-compiled by BRL Command Center';
}
